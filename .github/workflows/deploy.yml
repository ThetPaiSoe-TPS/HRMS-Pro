name: Deploy HRMS-Pro (Frontend + Backend → Nginx)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_DIR: /var/www/HRMS-Pro/backend
  FRONTEND_DIR: /var/www/HRMS-Pro/frontend
  NGINX_WEB_ROOT: /var/www/HRMS-Pro/frontend/dist
  PHP_SERVICE: php8.3-fpm

jobs:
  ##################################
  # BACKEND: Test & Deploy
  ##################################
  backend-deploy:
    name: Backend - Deploy Laravel
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            echo "🚀 Starting Backend Deployment..."
            cd ${{ env.BACKEND_DIR }}

            # Pull latest code
            git pull origin main

            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader

            # Set correct permissions
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache || true

            # Create storage symlink
            php artisan storage:link --force || true

            # Run database migrations
            php artisan migrate --force

            # Clear & re-cache for production
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Restart PHP-FPM to clear opcache
            sudo systemctl restart ${{ env.PHP_SERVICE }}

            echo "✅ Backend deployed successfully!"

  ##################################
  # FRONTEND: Build & Deploy
  ##################################
  frontend-deploy:
    name: Frontend - Build & Deploy React
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Application
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000/api/v1' }}
          VITE_STORAGE_URL: ${{ secrets.VITE_STORAGE_URL || 'http://localhost:8000/storage' }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 1

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend-dist

      - name: Deploy Frontend to Nginx via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: './frontend-dist/*'
          target: '/tmp/hrms-frontend-new'
          strip_components: 1
          rm: true

      - name: Activate Frontend on Nginx
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            echo "🚀 Starting Frontend Deployment..."

            # Backup current deployment with timestamp
            if [ -d "${{ env.NGINX_WEB_ROOT }}" ]; then
              BACKUP_DIR="${{ env.NGINX_WEB_ROOT }}-backup-$(date +%Y%m%d-%H%M%S)"
              mv "${{ env.NGINX_WEB_ROOT }}" "$BACKUP_DIR"
              echo "📦 Backup created: $BACKUP_DIR"
            fi

            # Move new build to Nginx web root
            mv /tmp/hrms-frontend-new "${{ env.NGINX_WEB_ROOT }}"
            chown -R www-data:www-data "${{ env.NGINX_WEB_ROOT }}"
            chmod -R 755 "${{ env.NGINX_WEB_ROOT }}"

            # Keep only last 3 backups (cleanup old ones)
            ls -d ${{ env.FRONTEND_DIR }}/dist-backup-* 2>/dev/null | sort | head -n -3 | xargs rm -rf || true

            # Reload Nginx to serve new files
            sudo nginx -t && sudo systemctl reload nginx

            echo "✅ Frontend deployed to: ${{ env.NGINX_WEB_ROOT }}"
